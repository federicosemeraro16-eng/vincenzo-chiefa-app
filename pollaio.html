<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vincenzo web - Fullstack prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/userlist.css" />
    <link rel="stylesheet" href="styles/base.css" />
  </head>
  <body>
    <header>
      <div class="header-logo">
        <img src="asset/logo.jpg" alt="Coach's logo" />
        <div class="header-container">
          <h1>Vincenzo Chiefa</h1>
          <h2>Chinesiologo Sportivo <br />Preparatore Atletico</h2>
        </div>
      </div>
    </header>
    <main>
      <div class="main-intro">
        <h2>Visualizza la lista gallini:</h2>
        <p>Controlla gli allenamenti del pollaio</p>
      </div>
      <div id="card-general-container">
        <div class="card-container">
          <div class="card-info-container">
            <p>Gallino:</p>
            <p>Federico Semeraro</p>
          </div>
          <div class="card-info-container">
            <p>Scadenza abbonamento:</p>
            <p>19-06-2025</p>
          </div>
          <div class="card-info-container" id="program-btn-container">
            <button type="onclick" class="button" id="program-btn">
              Crea Programma
            </button>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer-nav">
      <ul>
        <li><a href="">Visualizza progressioni</a></li>
        <li><a href="">Crea Programma</a></li>
        <li><a href="">Gesitsci abbonamento</a></li>
      </ul>
    </footer>
    <script src="scripts/script.js"></script>
    <script src="scripts/pollaio.js"></script>
  </body>
</html>
