<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vincenzo web - Fullstack prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/base.css" />
  </head>
  <body>
    <header>
      <div class="header-logo">
        <img src="asset/logo.jpg" alt="Coach's logo" />
        <div class="header-container">
          <h1>Vincenzo Chiefa</h1>
          <h2>Chinesiologo Sportivo <br />Preparatore Atletico</h2>
        </div>
      </div>
    </header>
    <main>
      <div class="main-intro">
        <h2>Ciao Vincenzo, registra il nuovo gallino:</h2>
        <p>Compila i dati di seguito e fallo entrare nel pollaio</p>
      </div>
      <form>
        <label for="name">Nome:</label>
        <input type="text" id="name" placeholder="Gallino.." />

        <label for="surname">Cognome:</label>
        <input type="text" id="surname" />

        <label for="subscription-months">Mesi di abbonamento:</label>
        <input type="number" id="subscription-months" />

        <label for="expiration-date">Scadenza abbonamento:</label>
        <input type="date" id="expiration-date" />

        

        <button type="button" id="save-user-btn">
          Registra Gallino
        </button>
      </form>
    </main>
    <footer class="footer-nav">
      <ul>
        <li><a href="">Crea Programma di allenamento</a></li>
        <li><a href="">Visualizza le progressioni</a></li>
        <li><a href="">Vai alla lista clienti</a></li>
      </ul>
    </footer>
    <script src="scripts/script.js"></script>
  </body>
</html>
