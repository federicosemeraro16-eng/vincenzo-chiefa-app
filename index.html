<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vincenzo web - Fullstack prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/base.css" />
  </head>
  <body>
    <header>
      <div class="header-logo">
        <img src="asset/logo.jpg" alt="Coach's logo" />
        <div class="header-container">
          <h1>Vincenzo Chiefa</h1>
          <h2>Chinesiologo Sportivo <br />Preparatore Atletico</h2>
        </div>
      </div>
    </header>
    <main>
      <!-- form per segnare i progressi -->
      <div class="main-intro">
        <h2>Progressioni:</h2>
        <p>
          Trascrivere serie, ripetizioni,kg utilizzati e fatica percepita
          <strong>rpe/rir</strong>
        </p>
      </div>
      <form>
        <label for="exercise">Esercizio:</label>
        <input type="text" id="exercise" placeholder="Squat..." />

        <label for="series">Serie:</label>
        <input type="number" id="series" />

        <label for="reps">Ripetizioni:</label>
        <input type="number" id="reps" />

        <label for="kgused">Kg usati:</label>
        <input type="number" id="kgused" />

        <label for="rpe-rir">RIR/RPE:</label>
        <input type="range" id="rpe-rir" />

        <button type="onsubmit" id="save-progression-btn">
          Registra progressione
        </button>
      </form>
<!-- bottone per concludere la sessione e salvare i dati della sessione completa di allenamento -->
      <button type="onclick" id="close-session-btn">
        Concludi la sessione
      </button>
    </main>
    <footer class="footer-nav">
      <ul>
        <li>Programma Completo</li>
        <li>Consulta il mesociclo</li>
        <li>Settimana corrente</li>
      </ul>
    </footer>
  </body>
</html>
