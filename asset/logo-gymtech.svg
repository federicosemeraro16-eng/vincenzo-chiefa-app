<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gtGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="#0d0d0d" stroke="url(#gtGreen)" stroke-width="2.5"/>

  <!-- dumbbell bar -->
  <rect x="27" y="46" width="46" height="8" rx="4" fill="url(#gtGreen)"/>

  <!-- left weight plates (fitness side) -->
  <rect x="19" y="32" width="9" height="36" rx="3" fill="url(#gtGreen)"/>
  <rect x="11" y="38" width="6" height="24" rx="2.5" fill="url(#gtGreen)"/>

  <!-- right weight plate morphing into a chip (tech side) -->
  <rect x="72" y="32" width="17" height="36" rx="4" fill="#101010" stroke="url(#gtGreen)" stroke-width="2"/>
  <circle cx="80.5" cy="42" r="2" fill="#1ED760"/>
  <path d="M76 50 h9 M76 55 h6 M76 60 h9" stroke="#1ED760" stroke-width="2" stroke-linecap="round"/>

  <!-- pulse / data line through the center, tech-tracking motif -->
  <polyline points="14,78 34,78 40,66 46,86 52,72 58,78 88,78"
            fill="none" stroke="url(#gtGreen)" stroke-width="3.2"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
